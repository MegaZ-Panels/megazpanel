# PostgreSQL Client Authentication for MegaZPanel
# Local connections only. The backend talks to PgBouncer on 127.0.0.1:6432;
# PgBouncer talks to Postgres on a Unix socket as the panel role.

# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             postgres                                peer
local   all             all                                     scram-sha-256
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256
