# MegaZPanel — PostgreSQL tuning for 1 GB VPS
# Loaded via include_dir = 'conf.d' from the main postgresql.conf.

# Memory
shared_buffers = 128MB
effective_cache_size = 384MB
work_mem = 4MB
maintenance_work_mem = 32MB

# Connections
max_connections = 20

# WAL / checkpoints
wal_buffers = 4MB
checkpoint_completion_target = 0.9
synchronous_commit = on

# Planner (assumes SSD)
random_page_cost = 1.1
effective_io_concurrency = 200

# Logging — keep light; rely on journald for system-level capture
log_min_duration_statement = 500ms
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 0
log_line_prefix = '%m [%p] %q%u@%d '

# Autovacuum — aggressive enough that monthly partitions stay tidy
autovacuum = on
autovacuum_max_workers = 2
autovacuum_naptime = 30s

# Locale / timezone
timezone = 'UTC'
log_timezone = 'UTC'

# Listen on localhost only (also enforced by installer)
listen_addresses = '127.0.0.1'
