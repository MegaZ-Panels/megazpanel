# MegaZPanel — production docker-compose (alternative to native systemd install).
# Use only if you actively want containers in production. The systemd installer
# is the recommended path for 1GB VPS targets.
#
# Provides hard memory caps, restart policies, and read-only root filesystems.

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      POSTGRES_DB: ${DB_NAME:?DB_NAME required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ../postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M

  pgbouncer:
    image: edoburu/pgbouncer:1.23.1
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 10
      MAX_CLIENT_CONN: 100
    deploy:
      resources:
        limits:
          memory: 32M

  backend:
    build:
      context: ..
      dockerfile: deploy/docker/backend.Dockerfile
    restart: always
    depends_on:
      pgbouncer:
        condition: service_started
    env_file:
      - ./backend.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@pgbouncer:6432/${DB_NAME}?schema=public
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 192M
    read_only: true
    tmpfs:
      - /tmp

  frontend:
    build:
      context: ..
      dockerfile: deploy/docker/frontend.Dockerfile
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-/api}
      NEXT_PUBLIC_APP_URL: ${PUBLIC_APP_URL:?PUBLIC_APP_URL required}
      NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL:?PUBLIC_WS_URL required}
      NEXT_PUBLIC_WS_PATH: /socket.io
    deploy:
      resources:
        limits:
          memory: 64M

  nginx:
    image: nginx:1.27-alpine
    restart: always
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/panel.conf.tpl:/etc/nginx/conf.d/default.conf:ro
      - le-certs:/etc/letsencrypt:ro
    deploy:
      resources:
        limits:
          memory: 32M

volumes:
  postgres-data:
  le-certs:
