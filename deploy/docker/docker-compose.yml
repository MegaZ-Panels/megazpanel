# MegaZPanel — development docker-compose
# Brings up Postgres, PgBouncer, MinIO, and the backend (Bun).
# The frontend is run separately via `cd frontend && bun run dev`.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: megaz
      POSTGRES_PASSWORD: megaz_dev_password
      POSTGRES_DB: megazpanel
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U megaz -d megazpanel"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:1.23.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_USER: megaz
      DB_PASSWORD: megaz_dev_password
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: megazpanel
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 10
      MAX_CLIENT_CONN: 100
    ports:
      - "127.0.0.1:6432:6432"

  minio:
    image: minio/minio:RELEASE.2024-10-29T16-01-48Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: megazadmin
      MINIO_ROOT_PASSWORD: megaz_dev_minio_password
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: deploy/docker/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_started
    env_file:
      - ./backend.env
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: postgresql://megaz:megaz_dev_password@pgbouncer:6432/megazpanel?schema=public
      WEB_ORIGIN: http://localhost:3000
      COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  minio-data:
